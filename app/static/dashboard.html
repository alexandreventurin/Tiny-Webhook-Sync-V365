<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Pedidos Rejuderme</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#172033}.topbar{min-height:62px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;border-bottom:1px solid #0f172a}.brand{display:flex;align-items:baseline;gap:12px}.brand h1{margin:0;font-size:18px;font-weight:800}.brand span{font-size:12px;color:#9fb0c5}.nav{display:flex;align-items:center;gap:8px}.nav a,.nav button{border:0;background:#26364a;color:#dbe7f5;border-radius:6px;padding:8px 11px;text-decoration:none;font-size:13px;cursor:pointer}.nav a:hover,.nav button:hover{background:#334a65;color:#fff}.auth-mini{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}.auth-mini-card{display:flex;align-items:center;gap:7px;min-width:155px;max-width:230px;height:34px;border:1px solid rgba(255,255,255,.16);background:#26364a;border-radius:7px;padding:0 8px;color:#dbe7f5}.auth-mini-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.auth-mini-card.ok .auth-mini-dot{background:#22c55e}.auth-mini-card.expired .auth-mini-dot{background:#ef4444}.auth-mini-card.missing .auth-mini-dot{background:#94a3b8}.auth-mini-text{min-width:0;flex:1}.auth-mini-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.auth-mini-detail{font-size:10px;color:#aebdd0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.auth-mini-link{background:#334a65;color:#fff;border-radius:5px;padding:5px 7px;text-decoration:none;font-size:10px;font-weight:800;white-space:nowrap}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 62px)}.side{background:#fff;border-right:1px solid #d9e1ea;padding:14px}.side button,.side a{width:100%;display:block;text-align:left;border:0;background:transparent;color:#334155;border-radius:7px;padding:10px 11px;font-size:14px;font-weight:800;text-decoration: ax(140px,1fr));gap:12px;margin-bottom:14px}.summary-grid.collapsed{display:none}.metric{border:1px solid #d9e1ea;border-radius:8px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}.metric .value{font-size:29px;font-weight:850}.metric .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#334155;margin-top:4px;line-height:1.25}.metric.blue{background:#bfdbfe;border-color:#60a5fa}.metric.green{background:#bbf7d0;border-color:#4ade80}.metric.orange{background:#fed7aa;border-color:#fb923c}.metric.lilac{background:#e9d5ff;border-color:#c084fc}.metric.red{background:#fecaca;border-color:#f87171}.metric.yellow{background:#fef08a;border-color:#facc15}.metric button{align-self:flex-start;margin-top:10px;height:28px;border:1px solid rgba(15,23,42,.14);background:#fff;border-radius:6px;padding:0 10px;font-size:12px;font-weight:800;color:#26364a;cursor:pointer}.toolbar{display:none;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px}.toolbar.open{display:grid}.search{height:40px;border:1px solid #cbd5e1;border-radius:6px;padding:0 12px;background:#fff;font-size:14px}.actions{display:flex;gap:8px}.actions button,.list-tools select{height:40px;border:1px solid #b6c2d1;background:#fff;border-radius:6px;padding:0 12px;font-size:13px;font-weight:800;color:#26364a;cursor:pointer}.filters{display:none;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;margin-bottom:12px}.filters.open{display:grid}.filters label{display:grid;gap:4px;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase}.filters .origin-only,.filters .webhook-only{display:none}.filters select,.filters input{min-height:36px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;background:#fff;color:#172033}.filters select[multiple]{height:92px;padding:6px 8px}.filters button{height:36px;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:6px;padding:0 12px;font-size:13px;font-weight:800;cursor:pointer;align-self:end}.view-head{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.view-head.open{display:flex}.subtabs{display:flex;gap:8px;align-items:center;overflow:auto}.subtab{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:0 10px;font-size:12px;font-weight:800;color:#536274;cursor:pointer;white-space:nowrap}.subtab.active{background:#1f3a5f;color:#fff;border-color:#1f3a5f}.list-tools{display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px;font-weight:800}.panel{display:none;background:#fff;border:1px solid #d9e1ea;border-radius:8px;overflow:hidden}.panel.open{display:block}.table-wrap{overflow:auto}.empty{padding:28px;text-align:center;color:#7a899a}.load-more{padding:12px;text-align:center;border-top:1px solid #e2e8f0}.load-more button{height:36px;border:1px solid #94a3b8;background:#fff;border-radius:6px;padding:0 14px;font-weight:800;color:#334155;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f8fafc;color:#6b7b8d;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid #d9e1ea;white-space:nowrap}td{padding:11px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}tbody tr:hover td{background:#f8fbff}.badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.ok{background:#dcfce7;color:#166534}.warn{background:#fff7ed;color:#c2410c}.bad{background:#fee2e2;color:#b91c1c}.info{background:#dbeafe;color:#1d4ed8}.muted{background:#eef2f7;color:#536274}.small{font-size:12px;color:#6b7b8d}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.queue-group td{background:#f1f5f9!important;color:#26364a;font-weight:800;border-top:1px solid #cbd5e1}.queue-meta{display:flex;gap:8px;flex-wrap:wrap}.queue-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;border:1px solid #cbd5e1;background:#fff;white-space:nowrap}.queue-chip.time{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}.queue-chip.exec{background:#dcfce7;border-color:#86efac;color:#166534}.queue-chip.limit{background:#fef3c7;border-color:#fbbf24;color:#92400e}.queue-plus{background:#1d4ed8;color:#fff;border-radius:999px;padding:2px 7px;font-size:11px}.flow{display:grid;gap:5px}.flow-line{display:flex;align-items:center;gap:8px;white-space:nowrap}.flow-dot{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(15,23,42,.06)}.flow-dot.in{background:#fbbf24}.flow-dot.out{background:#22c55e}.reason{display:flex;gap:4px;flex-wrap:wrap}.erp-link,.tracking-link{color:#172033;text-decoration:none}.erp-link:hover,.tracking-link:hover{text-decoration:underline}.danger-text{color:#dc2626;font-weight:800}.reviewbar{padding:12px;border-bottom:1px solid #e2e8f0;background:#f8fafc}.reviewbar button{height:34px;border:0;border-radius:6px;background:#1f3a5f;color:#fff;padding:0 12px;font-size:13px;font-weight:800;cursor:pointer}.reviewbar button:disabled{background:#cbd5e1;color:#64748b}.selectcol{width:38px;text-align:center}.loader{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(244,246,248,.78);backdrop-filter:blur(1px)}.loader.open{display:flex}.loader-box{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px 18px;box-shadow:0 12px 35px rgba(15,23,42,.16);font-size:13px;font-weight:800}.spinner{width:22px;height:22px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal-backdrop.open{display:flex}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:0 20px 70px rgba(15,23,42,.35);border:1px solid #d9e1ea}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #d9e1ea}.modal-head h2{font-size:16px;margin:0}.modal-head button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;height:32px;width:36px;font-size:20px;cursor:pointer}.modal-body{padding:14px 16px;display:grid;gap:10px}.check-row{display:flex;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:7px;padding:10px;background:#fbfdff}.check-row input{width:18px;height:18px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid #d9e1ea}.modal-foot button{height:38px;border:1px solid #b6c2d1;background:#fff;border-radius:6px;padding:0 12px;font-size:13px;font-weight:800;cursor:pointer}.modal-foot .primary{background:#2563eb;border-color:#2563eb;color:#fff}.modal-foot button:disabled{opacity:.45}.diff-row{display:grid;grid-template-columns:160px 1fr 1fr;gap:10px;padding:9px;border-bottom:1px solid #eef2f6}.diff-row.divergent{background:#fff7ed;border-left:3px solid #f97316}.toast{position:fixed;right:18px;bottom:18px;z-index:60;display:none;max-width:420px;background:#172033;color:#fff;border-radius:7px;padding:12px 14px;font-size:13px;box-shadow:0 12px 32px rgba(15,23,42,.25)}.toast.open{display:block}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #d9e1ea}.side button,.side a{display:inline-block;width:auto}.topbar{align-items:flex-start;flex-direction:column}.auth-mini{width:100%;justify-content:flex-start;flex-wrap:wrap}.period{align-items:flex-start;flex-direction:column}.period-controls,.filters{grid-template-columns:1fr 1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}.view-head{align-items:flex-start;flex-direction:column}.diff-row{grid-template-columns:1fr}}
.modal-note{margin:0;padding:10px;border-radius:6px;background:#eff6ff;color:#1e3a5f;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="loader open" id="loader"><div class="loader-box"><span class="spinner"></span><span id="loaderText">Carregando painel...</span></div></div>
<header class="topbar"><div class="brand"><h1>Gestão de Pedidos Rejuderme</h1><span>Integração Tiny</span></div><div class="auth-mini" id="authMini"></div><nav class="nav"><button id="refreshBtn">Atualizar</button><button id="resetBtn">Reiniciar página</button><a href="/logout">Sair</a></nav></header>
<div class="shell">
  <aside class="side">
    <button class="menu active" data-page="home">Início</button><div class="group">Listagens</div>
    <button class="menu" data-page="queue">Fila de Execuções</button><button class="menu child" data-page="queue" data-subtab="webhooks">Webhooks</button><button class="menu child" data-page="queue" data-subtab="executed">Sucesso</button><button class="menu child" data-page="queue" data-subtab="future">Futuros</button><button class="menu child" data-page="queue" data-subtab="error">Com erro</button>
    <button class="menu" data-page="origin">Pedidos na origem</button><button class="menu child" data-page="origin" data-subtab="ready">Prontos para exportação</button><button class="menu child" data-page="origin" data-subtab="needs_adjustment">Precisam de ajuste</button><button class="menu child" data-page="origin" data-subtab="do_not_export">Não exportar</button>
    <button class="menu" data-page="synced">Pedidos sincronizados</button><button class="menu" data-page="cancelled">Verificar cancelados</button><button class="menu child" data-page="cancelled" data-subtab="pending">Analisar</button><button class="menu child" data-page="cancelled" data-subtab="reviewed">Conferidos</button>
    <a class="legacy" href="/orders-panel">Painel anterior</a>
  </aside>
  <main class="content">
    <section class="period"><div class="period-title"><span>Período analisado</span><button class="period-pill" id="periodToggle">Hoje</button></div><button class="collapse-btn" id="collapseCards">Recolher cards</button></section>
    <section class="period-controls" id="periodControls"><div class="period-group"><strong>Dia</strong><button data-period="yesterday">Ontem</button><button data-period="today" class="active">Hoje</button></div><div class="period-group"><strong>Últimos</strong><button data-period="last_7">7 dias</button><button data-period="last_30">30 dias</button></div><div class="period-group"><strong>Mês</strong><button data-period="this_month">Este mês</button><button data-period="previous_month">Mês anterior</button></div><div class="period-range"><strong>Período</strong><label>Início<input id="customStart" type="date"></label><label>Fim<input id="customEnd" type="date"></label></div></section>
    <section class="summary-grid" id="summary"></section>
    <section class="toolbar" id="toolbar"><input id="search" class="search" placeholder="Pesquisar por pedido, cliente, CPF/CNPJ, ID, ecommerce, rastreio ou erro"><div class="actions"><button id="clearBtn">Limpar</button><button id="filtersBtn">Filtrar</button></div></section>
    <section class="filters" id="filters"><label>Conta<select id="filterAccount" multiple><option value="A">Rejuderme</option><option value="B">V.365</option></select></label><label>Tipo<select id="filterType" multiple></select></label><label>Situação<select id="filterStatus" multiple></select></label><label class="webhook-only">Ação<select id="filterAction" multiple></select></label><label>Data<input id="filterDate" type="date"></label><label>Hora<input id="filterHour" type="time"></label><label class="origin-only">Recebido<input id="filterReceivedDate" type="date"></label><label class="origin-only">Previsão envio<input id="filterPlannedDate" type="date"></label><label class="origin-only">Forma envio<select id="filterShipping" multiple></select></label><label class="origin-only">Motivos<select id="filterReason" multiple></select></label><button id="applyFilters">Aplicar filtros</button></section>
    <section class="view-head" id="viewHead"><div class="subtabs" id="subtabs"></div><div class="list-tools" id="listTools"></div></section>
    <section class="panel" id="panel"><div class="table-wrap" id="tableWrap"></div></section>
  </main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Fechar">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script src="/admin/dashboard.js"></script>
</body>
</html>
