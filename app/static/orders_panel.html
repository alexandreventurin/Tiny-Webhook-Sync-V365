<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Tiny Integrator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6f8;color:#172033;min-height:100vh}
.topbar{height:58px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px;border-bottom:1px solid #0f172a}
.brand{display:flex;align-items:baseline;gap:12px}.brand h1{margin:0;font-size:17px;font-weight:700}.brand span{font-size:12px;color:#9fb0c5}
.nav{display:flex;align-items:center;gap:10px}.nav a,.nav button{border:0;background:#26364a;color:#dbe7f5;border-radius:6px;padding:8px 11px;text-decoration:none;font-size:13px;cursor:pointer}.nav button:hover,.nav a:hover{background:#334a65;color:#fff}
.auth-mini{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}.auth-mini-card{display:flex;align-items:center;gap:7px;min-width:155px;max-width:230px;height:34px;border:1px solid rgba(255,255,255,.16);background:#26364a;border-radius:7px;padding:0 8px;color:#dbe7f5}.auth-mini-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.auth-mini-card.ok .auth-mini-dot{background:#22c55e}.auth-mini-card.expired .auth-mini-dot{background:#ef4444}.auth-mini-card.missing .auth-mini-dot{background:#94a3b8}.auth-mini-text{min-width:0;flex:1}.auth-mini-name{font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.auth-mini-detail{font-size:10px;color:#aebdd0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.auth-mini-link{border:0;background:#334a65;color:#fff;border-radius:5px;padding:5px 7px;text-decoration:none;font-size:10px;font-weight:800;white-space:nowrap}.auth-mini-link:hover{background:#3f5877}
.wrap{max-width:1380px;margin:0 auto;padding:18px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:10px}.search{height:40px;border:1px solid #cbd5e1;border-radius:6px;padding:0 12px;font-size:14px;background:#fff}.actions{display:flex;gap:8px}.actions button,.reviewbar button{height:40px;border:1px solid #b6c2d1;background:#fff;border-radius:6px;padding:0 12px;font-size:13px;cursor:pointer;color:#26364a}.actions button:hover,.reviewbar button:hover{background:#eef4fb}.reviewbar{display:flex;justify-content:flex-end;margin:0 0 10px}.reviewbar button:disabled{opacity:.45;cursor:not-allowed}.filters{display:none;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;margin-bottom:14px}.filters.open{display:grid}.filters label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.filters select,.filters input{width:100%;height:36px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;background:#fff;color:#172033}
.tabs{display:flex;gap:6px;border-bottom:1px solid #cbd5e1;margin-bottom:12px;overflow:auto}.tab{border:0;background:transparent;color:#536274;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:#10243e;border-bottom-color:#2563eb}
.subtabs{display:flex;gap:8px;align-items:center;margin:0 0 12px;overflow:auto}.subtab{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:0 10px;font-size:12px;font-weight:700;color:#536274;cursor:pointer;white-space:nowrap}.subtab.active{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
.summary{display:grid;gap:10px;margin-bottom:14px}.summary-period{display:flex;justify-content:flex-start;align-items:center;gap:8px;color:#536274;font-size:13px;font-weight:700}.period-pill{display:inline-flex;align-items:center;min-height:26px;border:1px solid #bfd7ff;background:#eaf2ff;color:#17437a;border-radius:6px;padding:0 9px;font-size:12px;font-weight:800}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.metric{border:1px solid #d9e1ea;border-radius:8px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}.metric .value{font-size:25px;font-weight:800;color:#172033}.metric .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#334155;margin-top:3px}.metric.blue{background:#cfe3ff;border-color:#7fb2ff}.metric.green{background:#c8f0d6;border-color:#75d994}.metric.orange{background:#ffe0b3;border-color:#ffb75d}.metric.gray{background:#dde5ef;border-color:#acb8c8}.metric.red{background:#ffd1d1;border-color:#ff8a8a}.metric.purple{background:#ded2ff;border-color:#ad93ff}.metric.teal{background:#c5f0e9;border-color:#67d4c7}.metric button{align-self:flex-start;margin-top:8px;height:26px;border:1px solid rgba(15,23,42,.12);background:#fff;border-radius:6px;padding:0 9px;font-size:12px;font-weight:700;color:#26364a;cursor:pointer}.metric button:hover{background:#f8fafc}
.panel{background:#fff;border:1px solid #d9e1ea;border-radius:8px;overflow:hidden}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f8fafc;color:#6b7b8d;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid #d9e1ea;white-space:nowrap}td{padding:11px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover td{background:#f8fbff}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.ok{background:#dcfce7;color:#166534}.warn{background:#fff7ed;color:#c2410c}.bad{background:#fee2e2;color:#b91c1c}.info{background:#dbeafe;color:#1d4ed8}.muted{background:#eef2f7;color:#536274}
.reason{display:flex;gap:5px;flex-wrap:wrap}.empty{padding:36px;text-align:center;color:#7a899a;font-size:14px}.small{font-size:12px;color:#6b7b8d}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.attention{color:#be123c;font-weight:800}.erp-link{color:#172033;text-decoration:none}.erp-link:hover{color:#2563eb;text-decoration:underline}.selectcol{width:36px;text-align:center}.flow-dot{display:inline-block;font-size:22px;line-height:1;margin-right:7px;vertical-align:middle}.flow-in{color:#d97706}.flow-out{color:#16a34a}.queue-group td{background:#f1f5f9!important;color:#26364a;font-weight:800;border-top:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1}.queue-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.queue-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;border:1px solid #cbd5e1;background:#fff;color:#26364a;white-space:nowrap}.queue-chip.time{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}.queue-chip.exec{background:#dcfce7;border-color:#86efac;color:#166534}.queue-chip.limit{background:#fef3c7;border-color:#fbbf24;color:#92400e}.queue-plus{background:#1d4ed8;color:#fff;border-radius:999px;padding:2px 7px;font-size:11px}.load-more{display:flex;justify-content:center;padding:14px;background:#fff}.load-more button{height:36px;border:1px solid #b6c2d1;background:#fff;border-radius:6px;padding:0 14px;font-size:13px;font-weight:700;color:#26364a;cursor:pointer}.load-more button:hover{background:#eef4fb}
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.3);display:none}.drawer-backdrop.open{display:block}.drawer{position:fixed;top:0;right:0;width:min(960px,100vw);height:100vh;background:#fff;box-shadow:-16px 0 50px rgba(15,23,42,.22);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}.drawer.open{transform:translateX(0)}
.drawer-head{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9e1ea;padding:0 16px}.drawer-head h2{font-size:16px;margin:0}.drawer-head button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;height:34px;width:38px;font-size:20px;cursor:pointer;color:#334155}
.drawer-body{overflow:auto;padding:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #d9e1ea;border-radius:8px;overflow:hidden;background:#fbfdff}.box h3{margin:0;padding:10px 12px;font-size:13px;background:#f8fafc;border-bottom:1px solid #d9e1ea}.fields{padding:8px 12px;display:grid;gap:8px}.field{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:13px}.field label{color:#6b7b8d;font-size:12px}.diffs{margin-top:12px;border:1px solid #fed7aa;background:#fff7ed;border-radius:8px;overflow:hidden}.diffs h3{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid #fed7aa}.diff-row{display:grid;grid-template-columns:170px 1fr 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid #ffedd5;font-size:12px}.diff-row:last-child{border-bottom:0}.diff-row.divergent{background:#fff1f2;border-bottom-color:#fecdd3}.diff-row.divergent strong{color:#be123c}.detail-total{margin-top:12px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font-size:13px;font-weight:700}.pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;max-height:280px;overflow:auto;background:#0f172a;color:#dbeafe;border-radius:6px;padding:10px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:0 20px 70px rgba(15,23,42,.35);border:1px solid #d9e1ea}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #d9e1ea}.modal-head h2{font-size:16px;margin:0}.modal-head button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;height:32px;width:36px;font-size:20px;cursor:pointer}.modal-body{padding:14px 16px;display:grid;gap:10px}.check-row{display:flex;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:7px;padding:10px;background:#fbfdff}.check-row input{width:18px;height:18px}.check-row strong{font-size:13px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid #d9e1ea}.modal-foot button{height:38px;border:1px solid #b6c2d1;background:#fff;border-radius:6px;padding:0 12px;font-size:13px;font-weight:700;color:#26364a;cursor:pointer}.modal-foot .primary{background:#2563eb;border-color:#2563eb;color:#fff}.modal-foot button:disabled{opacity:.45;cursor:not-allowed}
.loading{opacity:.55;pointer-events:none}
@media(max-width:760px){.topbar{height:auto;gap:10px;align-items:flex-start;flex-direction:column;padding:14px}.auth-mini{width:100%;justify-content:flex-start;flex-wrap:wrap}.toolbar{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr}.field,.diff-row{grid-template-columns:1fr}.wrap{padding:12px}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Gestão de Pedidos</h1><span>Tiny Integrator</span></div>
  <div class="auth-mini" id="authMini"></div>
  <nav class="nav">
    <a href="/dashboard">Dashboard</a>
    <button id="refreshBtn">Atualizar</button>
    <a href="/logout">Sair</a>
  </nav>
</header>
<main class="wrap">
  <section class="toolbar">
    <input id="search" class="search" placeholder="Pesquisar por pedido, cliente, CPF/CNPJ, status ou ID">
    <div class="actions">
      <button id="clearBtn">Limpar</button>
      <button id="filtersBtn">Filtros</button>
    </div>
  </section>
  <section class="filters" id="filters">
    <div><label>Data</label><select id="filterDays"><option value="30">Últimos 30 dias</option><option value="7">Últimos 7 dias</option><option value="90">Últimos 90 dias</option><option value="365">Últimos 365 dias</option></select></div>
    <div><label>Divergência</label><select id="filterDivergence"><option value="">Todos</option><option value="yes">Com divergência</option><option value="no">Sem divergência</option></select></div>
    <div><label>Ecommerce</label><input id="filterEcommerce" placeholder="Shopify, Mercado Livre..."></div>
    <div><label>Situação origem</label><select id="filterOriginStatus"><option value="">Todas</option></select></div>
    <div><label>Fila</label><select id="filterQueueWindow"><option value="">Todas</option></select></div>
    <div><label>Tarefa</label><select id="filterQueueTask"><option value="">Todas</option></select></div>
    <div><label>Status tarefa</label><select id="filterQueueStatus"><option value="">Todos</option></select></div>
  </section>
  <section class="summary" id="summary"></section>
  <section class="tabs">
    <button class="tab" data-tab="queue">Fila de Execuções</button>
    <button class="tab active" data-tab="origin">Pedidos na origem</button>
    <button class="tab" data-tab="synced">Pedidos sincronizados</button>
    <button class="tab" data-tab="errors">Tentativas com erro</button>
    <button class="tab" data-tab="cancelled">Verificar cancelados</button>
  </section>
  <section class="subtabs" id="subtabs"></section>
  <section class="panel">
    <div class="table-wrap" id="tableWrap"></div>
  </section>
</main>
<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Pedido</h2>
    <button id="closeDrawer" aria-label="Fechar">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="modal-backdrop" id="syncModal">
  <div class="modal">
    <div class="modal-head">
      <h2>Sincronizar divergências</h2>
      <button id="closeSyncModal" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body" id="syncModalBody"></div>
    <div class="modal-foot">
      <button id="cancelSyncModal">Cancelar</button>
      <button class="primary" id="confirmSyncDivergences" disabled>Enviar para fila</button>
    </div>
  </div>
</div>
<script>
const state={tab:'origin',subtab:'valid',query:'',data:null,events:[],auth:{tokens:[],health:{}},selectedCancelled:new Set(),pageSizes:{},filters:{days:'30',divergence:'',ecommerce:'',originStatus:'',queueWindow:'',queueTask:'',queueStatus:''}};
const $=id=>document.getElementById(id);
const fmt=v=>v===null||v===undefined||v===''?'—':String(v);
const date=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
const dateOnly=v=>v?String(v):'—';
const esc=v=>String(fmt(v)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const textOf=o=>JSON.stringify(o||{}).toLowerCase();
const PAGE_STEP=20;

function badge(label,type='muted'){return `<span class="badge ${type}">${esc(label)}</span>`}
function statusText(s){return s==='concluido'?'Concluído':(s==='aguardando'?'Aguardando':(s==='erro'?'Erro':fmt(s)))}
function taskBadge(s){return badge(statusText(s),s==='concluido'?'ok':(s==='erro'?'bad':'info'))}
function windowLabel(key){
  if(!key||key==='sem-data')return 'Sem horário';
  const start=new Date(key);
  if(Number.isNaN(start.getTime()))return key;
  return `${start.toLocaleString('pt-BR')} + 10min`;
}
function shippingCell(x,compare=false){
  const shipping=x.forma_envio||x.forma_frete;
  const tracking=x.codigo_rastreamento;
  const shippingClass=compare&&x.forma_envio_divergent?'attention':'';
  const trackingClass=compare&&x.codigo_rastreamento_divergent?'attention':'';
  return `<span class="${shippingClass}">${esc(shipping||'-')}</span><div class="small mono ${trackingClass}">${esc(tracking||'sem rastreio')}</div>${x.endereco_faturamento_diferente_entrega?badge('entrega diferente','info'):''}`;
}
function nfTitle(x){return x.nota_fiscal_destino?`NF ${x.nota_fiscal_destino}`:'NF -'}
function erpLink(id,html){return id?`<a class="erp-link" href="https://erp.olist.com/vendas#edit/${encodeURIComponent(id)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${html}</a>`:html}
function flowCell(x){
  return `<div><span class="flow-dot flow-in">&#9679;</span>${esc(date(x.webhook_received_at))}</div><div class="small"><span class="flow-dot flow-out">&#9679;</span>${esc(date(x.transfer_scheduled_at))}</div>`;
}
function matches(item){return !state.query||textOf(item).includes(state.query.toLowerCase())}
function matchesFilters(item){
  if(state.filters.ecommerce && !String(item.ecommerce_nome||'').toLowerCase().includes(state.filters.ecommerce.toLowerCase()))return false;
  if(state.filters.originStatus && (item.situacao_a_label||item.situacao_label||'')!==state.filters.originStatus)return false;
  if(state.tab==='queue'&&state.filters.queueWindow&&item.window_key!==state.filters.queueWindow)return false;
  if(state.tab==='queue'&&state.filters.queueTask&&item.task_label!==state.filters.queueTask)return false;
  if(state.tab==='queue'&&state.filters.queueStatus&&item.task_status!==state.filters.queueStatus)return false;
  if(state.tab==='synced'&&state.filters.divergence==='yes'&&!(item.divergence_count>0))return false;
  if(state.tab==='synced'&&state.filters.divergence==='no'&&item.divergence_count!==0)return false;
  return true;
}

async function load(){
  document.body.classList.add('loading');
  try{
    const res=await fetch(`/admin/orders-panel/data?limit=240&days=${encodeURIComponent(state.filters.days)}&divergence_limit=80`);
    if(res.status===401){location.href='/login?next=/orders-panel';return}
    if(!res.ok)throw new Error('Falha ao carregar pedidos: '+res.status);
    state.data=await res.json();
    render();
    renderAuthMini();
    loadPanelExtras();
  }catch(err){
    $('summary').innerHTML='';
    $('subtabs').innerHTML='';
    $('tableWrap').innerHTML=`<div class="empty">${esc(err.message||err)}</div>`;
  }finally{
    document.body.classList.remove('loading');
  }
}

async function loadPanelExtras(){
  try{
    const [eventsRes,tokensRes]=await Promise.all([
      fetch('/admin/events?limit=100').catch(()=>null),
      fetch('/admin/tokens').catch(()=>null)
    ]);
    state.events=eventsRes&&eventsRes.ok?(await eventsRes.json()).events||[]:[];
    state.auth.tokens=tokensRes&&tokensRes.ok?(await tokensRes.json()).tokens||[]:[];
    renderAuthMini();
    renderSubtabs();
    if(state.tab==='queue'&&state.subtab==='webhooks')renderTable();
    refreshAuthHealth();
  }catch(e){}
}

function render(){
  renderFilterOptions();
  renderSummary();
  renderSubtabs();
  renderTable();
}

async function refreshAuthHealth(){
  try{
    const res=await fetch('/admin/tokens/health');
    if(res.ok){state.auth.health=await res.json();renderAuthMini()}
  }catch(e){}
}

function renderAuthMini(){
  const bar=$('authMini');
  if(!bar)return;
  const tokens={A:null,B:null};
  (state.auth.tokens||[]).forEach(t=>tokens[t.account]=t);
  const labels={A:'Rejuderme',B:'V.365'};
  const paths={A:'/auth/a/start',B:'/auth/c/start'};
  bar.innerHTML=['A','B'].map(acc=>{
    const t=tokens[acc];
    const h=state.auth.health?.[acc];
    let cls='missing', status='Sem conexão', detail='Reconectar';
    if(t){
      const expires=t.expires_at?new Date(t.expires_at):null;
      const valid=expires&&expires>new Date();
      if(!valid){cls='expired';status='Expirado';}
      else if(h&&h.ok===false){cls='expired';status=h.status_code===401?'Token inválido':'Falha';}
      else{cls='ok';status='Conectado';}
    }
    return `<div class="auth-mini-card ${cls}"><span class="auth-mini-dot"></span><div class="auth-mini-text"><div class="auth-mini-name">Tiny ${esc(labels[acc])}</div><div class="auth-mini-detail">${esc(status)}</div></div><a class="auth-mini-link" href="${paths[acc]}" target="_blank">${detail}</a></div>`;
  }).join('');
}

function renderFilterOptions(){
  const all=[...(state.data?.origin?.valid||[]),...(state.data?.origin?.needs_adjustment||[]),...(state.data?.origin?.do_not_export||[]),...(state.data?.synced||[])];
  const statuses=[...new Set(all.map(x=>x.situacao_a_label||x.situacao_label).filter(Boolean))].sort();
  const current=state.filters.originStatus;
  $('filterOriginStatus').innerHTML='<option value="">Todas</option>'+statuses.map(s=>`<option value="${esc(s)}" ${s===current?'selected':''}>${esc(s)}</option>`).join('');
  const queue=state.data?.queue?.items||[];
  const windows=[...new Set(queue.map(x=>x.window_key).filter(Boolean))].sort();
  const tasks=[...new Set(queue.map(x=>x.task_label).filter(Boolean))].sort();
  const queueStatuses=[...new Set(queue.map(x=>x.task_status).filter(Boolean))].sort();
  $('filterQueueWindow').innerHTML='<option value="">Todas</option>'+windows.map(w=>`<option value="${esc(w)}" ${w===state.filters.queueWindow?'selected':''}>${esc(windowLabel(w))}</option>`).join('');
  $('filterQueueTask').innerHTML='<option value="">Todas</option>'+tasks.map(t=>`<option value="${esc(t)}" ${t===state.filters.queueTask?'selected':''}>${esc(t)}</option>`).join('');
  $('filterQueueStatus').innerHTML='<option value="">Todos</option>'+queueStatuses.map(s=>`<option value="${esc(s)}" ${s===state.filters.queueStatus?'selected':''}>${esc(statusText(s))}</option>`).join('');
}

function renderSummary(){
  const d=state.data||{origin:{valid:[],needs_adjustment:[],do_not_export:[]},synced:[],errors:[],cancelled:{pending:[],reviewed:[]},queue:{items:[]}};
  const scheduled=(d.origin.valid||[]).length+(d.origin.needs_adjustment||[]).length;
  const divergent=(d.synced||[]).filter(x=>x.divergence_count>0).length;
  const syncedTotal=d.summary_counts?.synced_total??d.synced.length;
  const period=`Últimos ${esc(d.period_days||state.filters.days)} dias`;
  const cards=[
    ['Agendados para exportação',scheduled,'blue'],
    ['Prontos para exportação',d.origin.valid.length,'green'],
    ['Precisam de ajuste',d.origin.needs_adjustment.length,'orange','Atualizar','showNeedsAdjustment()'],

function metricCard([label,value,tone,actionLabel,action]){
  const actionHtml=actionLabel?`<button onclick="event.stopPropagation();${action}">${esc(actionLabel)}</button>`:'';
  return `<div class="metric ${esc(tone)}"><div><div class="value">${esc(value)}</div><div class="label">${esc(label)}</div></div>${actionHtml}</div>`;
}
function renderSubtabs(){
  const d=state.data||{origin:{valid:[],needs_adjustment:[],do_not_export:[]},synced:[],errors:[],cancelled:{pending:[],reviewed:[]}};
  if(state.tab==='queue'){
    const queue=d.queue?.items||[];
    const sequence=queue.filter(x=>!x.is_future);
    const future=queue.filter(x=>x.is_future);
    if(!['sequence','future','webhooks'].includes(state.subtab))state.subtab='sequence';
    $('subtabs').innerHTML=[
      `<button class="subtab ${state.subtab==='sequence'?'active':''}" data-subtab="sequence">Em sequência (${sequence.length})</button>`,
      `<button class="subtab ${state.subtab==='future'?'active':''}" data-subtab="future">Futuros (${future.length})</button>`,
      `<button class="subtab ${state.subtab==='webhooks'?'active':''}" data-subtab="webhooks">Webhooks (${state.events.length})</button>`
    ].join('');
  }else if(state.tab==='origin'){
    const items=[
      ['valid','Prontos para exportação',d.origin.valid.length],
      ['needs_adjustment','Precisam ajuste',d.origin.needs_adjustment.length],
      ['do_not_export','Não exportar',d.origin.do_not_export.length],
    ];
    $('subtabs').innerHTML=items.map(([key,label,count])=>`<button class="subtab ${state.subtab===key?'active':''}" data-subtab="${key}">${label} (${count})</button>`).join('');
  }else if(state.tab==='synced'){
    const statuses=[...new Set(d.synced.map(x=>x.situacao_destino_label||x.situacao_destino||'sem status'))].sort();
    if(!statuses.includes(state.subtab)&&state.subtab!=='all')state.subtab='all';
    $('subtabs').innerHTML=[`<button class="subtab ${state.subtab==='all'?'active':''}" data-subtab="all">Todos (${d.synced.length})</button>`]
      .concat(statuses.map(s=>`<button class="subtab ${state.subtab===s?'active':''}" data-subtab="${esc(s)}">${esc(s)} (${d.synced.filter(x=>(x.situacao_destino_label||x.situacao_destino||'sem status')===s).length})</button>`)).join('');
  }else if(state.tab==='cancelled'){
    const pending=d.cancelled?.pending||[];
    const reviewed=d.cancelled?.reviewed||[];
    if(!['pending','reviewed'].includes(state.subtab))state.subtab='pending';
    $('subtabs').innerHTML=[
      `<button class="subtab ${state.subtab==='pending'?'active':''}" data-subtab="pending">A analisar (${pending.length})</button>`,
      `<button class="subtab ${state.subtab==='reviewed'?'active':''}" data-subtab="reviewed">Analisados (${reviewed.length})</button>`
    ].join('');
  }else{
    const statuses=[...new Set(d.errors.map(x=>x.status||'erro'))].sort();
    if(!statuses.includes(state.subtab)&&state.subtab!=='all')state.subtab='all';
    $('subtabs').innerHTML=[`<button class="subtab ${state.subtab==='all'?'active':''}" data-subtab="all">Todos (${d.errors.length})</button>`]
      .concat(statuses.map(s=>`<button class="subtab ${state.subtab===s?'active':''}" data-subtab="${esc(s)}">${esc(s)} (${d.errors.filter(x=>(x.status||'erro')===s).length})</button>`)).join('');
  }
  document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{state.subtab=b.dataset.subtab;renderTable();renderSubtabs()});
}

function table(headers,rows){
  if(!rows.length)return '<div class="empty">Nenhum pedido encontrado.</div>';
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

function viewKey(extra=''){
  return `${state.tab}:${state.subtab}:${state.query}:${state.filters.days}:${state.filters.divergence}:${state.filters.ecommerce}:${state.filters.originStatus}:${state.filters.queueWindow}:${state.filters.queueTask}:${state.filters.queueStatus}:${extra}`;

function visibleList(list,extra=''){

function loadMoreHtml(page){

  const groups=Object.fromEntries((state.data?.queue?.groups||[]).map(g=>[g.window_key,g]));

  list.forEach(x=>{
    if(x.window_key!==last){
      rows.push(queueGroupRow(groups[x.window_key]||{window_key:x.window_key}));
      last=x.window_key;
    }
    rows.push(`
      <tr data-a="${esc(x.venda_a_id||'')}" data-c="${esc(x.venda_c_id||'')}">
        <td>${erpLink(x.venda_a_id,`<strong>${esc(x.numero||x.venda_a_id||'-')}</strong><div class="small mono">ID A ${esc(x.venda_a_id||'-')}</div>`)}<div>${badge(x.situacao_a_label||x.situacao_label||'sem status','info')}</div></td>
        <td>${erpLink(x.venda_c_id,`<strong>${esc(nfTitle(x))}</strong><div class="small mono">ID C ${esc(x.venda_c_id||'-')}</div>`)}<div>${badge(x.situacao_destino_label||'pendente','muted')}</div></td>

        <td>${esc(dateOnly(x.data))}</td>
        <td>${esc(x.cliente||'-')}<div class="small">${esc(x.cpf_cnpj||'-')}</div></td>

        <td>${date(x.last_sync_at||x.updated_at)}</td>

        <td>${shippingCell(x)}</td>
        <td>${esc(x.itens)}</td>
        <td><div class="reason">${x.reasons.length?x.reasons.map(r=>badge(r,x.export_category==='do_not_export'?'bad':'warn')).join(''):badge('pronto','ok')}</div></td>
      </tr>`))+loadMoreHtml(page);

function pick(o,path){return path.split('.').reduce((a,p)=>a&&a[p],o)}
function field(label,value){return `<div class="field"><label>${label}</label><div>${esc(value)}</div></div>`}
function detailRows(fields){
  return (fields||[]).map(f=>`<div class="diff-row ${f.divergent?'divergent':''}"><strong>${esc(f.label)}</strong><div>${esc(f.origin)}</div><div>${esc(f.destination)}</div></div>`).join('');
}

function divergenceTypeCounts(){
  const counts={};
  (state.data?.synced||[]).forEach(order=>{
    (order.divergence_types||[]).forEach(type=>{
      if(!type.key)return;
      if(!counts[type.key])counts[type.key]={key:type.key,label:type.label||type.key,count:0};
      counts[type.key].count++;
    });
  });
  return Object.values(counts).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'));
}

function openDivergenceSyncModal(){
  const types=divergenceTypeCounts();
  if(!types.length){alert('Não há divergências sincronizáveis no período carregado.');return}
  $('syncModalBody').innerHTML=`
    <div class="small">Selecione quais tipos de divergência devem virar tarefas na fila. A direção será decidida por pedido, usando a alteração mais recente registrada entre A e C.</div>
    ${types.map(type=>`
      <label class="check-row">
        <input type="checkbox" class="sync-diff-check" value="${esc(type.key)}">
        <span><strong>${esc(type.label)}</strong><div class="small">${esc(type.count)} pedido(s) com essa divergência</div></span>
      </label>`).join('')}`;
  $('syncModal').classList.add('open');
  $('confirmSyncDivergences').disabled=true;
  document.querySelectorAll('.sync-diff-check').forEach(cb=>cb.onchange=()=>{
    $('confirmSyncDivergences').disabled=!document.querySelectorAll('.sync-diff-check:checked').length;
  });
}

function closeDivergenceSyncModal(){
  $('syncModal').classList.remove('open');
}

async function confirmDivergenceSync(){
  const fieldKeys=[...document.querySelectorAll('.sync-diff-check:checked')].map(cb=>cb.value);
  if(!fieldKeys.length)return;
  $('confirmSyncDivergences').disabled=true;
  const res=await fetch('/admin/orders-panel/divergences/sync',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({field_keys:fieldKeys,days:state.filters.days})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok){alert(data.error||'Não foi possível criar as tarefas.');$('confirmSyncDivergences').disabled=false;return}
  closeDivergenceSyncModal();
  alert(`${data.created||0} tarefa(s) enviada(s) para a fila.`);
  state.tab='queue';
  state.subtab='sequence';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='queue'));
  await load();
}

async function confirmCancelledReview(){
  const ids=[...state.selectedCancelled];
  if(!ids.length)return;
  if(!confirm(`${ids.length} pedido(s) devem ser enviados para Analisados?`))return;
  const res=await fetch('/admin/orders-panel/cancelled/mark-reviewed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({venda_a_ids:ids})});
  if(!res.ok){alert('Não foi possível confirmar a análise.');return}
  state.selectedCancelled.clear();
  await load();
  state.tab='cancelled';
  state.subtab='reviewed';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='cancelled'));
  render();
}

async function showNeedsAdjustment(){
  state.tab='origin';
  state.subtab='needs_adjustment';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='origin'));
  await load();
}

async function retryPanelErrors(){
  if(!confirm('Retentar os trabalhos com erro agora?'))return;
  const res=await fetch('/admin/jobs/retry-failed',{method:'POST'});
  if(!res.ok){alert('Não foi possível reenfileirar os erros.');return}
  const data=await res.json();
  alert(`${data.retried||0} tarefa(s) recolocada(s) na fila.`);
  state.tab='queue';
  state.subtab='sequence';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='queue'));
  await load();
}

$('filterQueueTask').onchange=e=>{state.filters.queueTask=e.target.value;renderTable()};
